name: Auto-Pilot Dispatcher

on:
  schedule:
    - cron: '40 17 * * *'
    - cron: '40 07 * * *'
  workflow_dispatch:
    inputs:
      force_channel:
        description: 'Force dispatch a specific channel'
        required: false
        type: choice
        options:
          - "auto"
          - "Brew-Fi"
          - "Grid Hardened"

jobs:
  determine:
    runs-on: ubuntu-latest
    outputs:
      channel: ${{ steps.channel.outputs.channel }}
    steps:
      - name: Determine Channel
        id: channel
        run: |
          FORCE="${{ inputs.force_channel }}"
          if [ -n "$FORCE" ] && [ "$FORCE" != "auto" ]; then
            echo "channel=$FORCE" >> $GITHUB_OUTPUT
          else
            CRON="${{ github.event.schedule }}"
            if [ "$CRON" = "40 17 * * *" ]; then
              echo "channel=Brew-Fi" >> $GITHUB_OUTPUT
            else
              echo "channel=Grid Hardened" >> $GITHUB_OUTPUT
            fi
          fi

  trigger:
    needs: determine
    uses: ./.github/workflows/render.yml
    with:
      action_type: CREATE_AUTOMATIC
      channel_name: ${{ needs.determine.outputs.channel }}
      topic: ""
    secrets: inherit
